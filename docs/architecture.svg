<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Architecture: the agent calls browser tools on the Host plugin, which drives a dedicated Chrome over CDP and streams the live view and activity log into the cockpit beside the conversation.">
  <rect width="960" height="360" rx="18" fill="#0f1115"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <!-- DSH window -->
    <rect x="30" y="42" width="520" height="236" rx="14" fill="#141821" stroke="#2a3040"/>
    <text x="48" y="64" fill="#9aa3b2" font-size="11" letter-spacing="0.08em">DEEPSEEK HARNESS</text>

    <!-- Conversation -->
    <rect x="50" y="78" width="224" height="176" rx="10" fill="#1a1f2b" stroke="#2f3646"/>
    <text x="66" y="100" fill="#e6e9ef" font-size="13" font-weight="600">Conversation</text>
    <rect x="66" y="114" width="150" height="9" rx="4.5" fill="#2b3242"/>
    <rect x="66" y="130" width="184" height="9" rx="4.5" fill="#2b3242"/>
    <rect x="120" y="146" width="130" height="9" rx="4.5" fill="#2b3242"/>
    <rect x="66" y="176" width="192" height="58" rx="8" fill="#11151d" stroke="#2f3646"/>
    <text x="80" y="198" fill="#6f7a8c" font-size="11">ask the agent to fix the page</text>
    <text x="80" y="216" fill="#4f6bed" font-size="11">browser_* tools</text>

    <!-- Cockpit -->
    <rect x="298" y="78" width="234" height="176" rx="10" fill="#1a1f2b" stroke="#3b5bdb"/>
    <text x="314" y="100" fill="#e6e9ef" font-size="13" font-weight="600">Browser cockpit</text>
    <rect x="314" y="112" width="202" height="66" rx="8" fill="#0b0e13" stroke="#2f3646"/>
    <text x="326" y="138" fill="#9aa3b2" font-size="11">live view (read-only)</text>
    <rect x="314" y="186" width="202" height="54" rx="8" fill="#0b0e13" stroke="#2f3646"/>
    <text x="326" y="208" fill="#9aa3b2" font-size="11">activity · now / just now</text>
    <text x="326" y="226" fill="#3fb950" font-size="10">● click “Save” · 0.3 s</text>

    <!-- Host plugin -->
    <rect x="630" y="54" width="286" height="104" rx="12" fill="#182033" stroke="#3b5bdb"/>
    <text x="650" y="80" fill="#e6e9ef" font-size="14" font-weight="600">Host plugin</text>
    <text x="650" y="102" fill="#9aa3b2" font-size="11.5">browser tools · activity log</text>
    <text x="650" y="122" fill="#9aa3b2" font-size="11.5">panel routes · screenshots</text>
    <text x="650" y="142" fill="#6f7a8c" font-size="10.5">localhost only · same-origin POST</text>

    <!-- Chrome -->
    <rect x="630" y="240" width="286" height="100" rx="12" fill="#1a1f2b" stroke="#2f3646"/>
    <text x="650" y="266" fill="#e6e9ef" font-size="14" font-weight="600">Chrome</text>
    <text x="650" y="288" fill="#9aa3b2" font-size="11.5">dedicated profile</text>
    <text x="650" y="308" fill="#9aa3b2" font-size="11.5">one page · headless by default</text>
    <text x="650" y="328" fill="#6f7a8c" font-size="10.5">your project · console · DOM</text>

    <!-- tool calls arrow -->
    <path d="M540 132 H612" stroke="#4f6bed" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
    <text x="548" y="122" fill="#7f8db3" font-size="10.5">tool calls</text>

    <!-- CDP arrow both ways -->
    <path d="M772 166 V232" stroke="#4f6bed" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue-start)"/>
    <text x="782" y="204" fill="#7f8db3" font-size="10.5">CDP</text>

    <!-- frames / activity back to cockpit -->
    <path d="M630 96 H540" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow-green)"/>
    <text x="558" y="88" fill="#5f9e72" font-size="10.5">frames · log</text>

    <!-- caption -->
    <text x="480" y="312" fill="#6f7a8c" font-size="11" text-anchor="middle">Everything stays on this machine: the agent only sees what this cockpit captures.</text>

    <defs>
      <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#4f6bed"/>
      </marker>
      <marker id="arrow-blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M10 0 L0 5 L10 10 z" fill="#4f6bed"/>
      </marker>
      <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/>
      </marker>
    </defs>
  </g>
</svg>
